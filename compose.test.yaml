services:
  web-build:
    image: node:22-alpine
    working_dir: /app/workspace/web/site
    volumes:
      - .:/app
    command: npx vite build --mode test

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./workspace/web/site/dist:/usr/share/nginx/html:ro
    environment:
      VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-/auth}
      VITE_COUCH_BASE_URL: ${VITE_COUCH_BASE_URL:-/db}
    configs:
      - source: nginx_prod_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      couchdb:
        condition: service_healthy
      auth:
        condition: service_healthy

  auth:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /workspace/workspace/service/auth-service
    volumes:
      - .:/workspace:ro
    expose:
      - "4000"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password}
      COUCHDB_URL: ${COUCHDB_URL:-http://couchdb:5984}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
    command: node ./src/server.ts
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      couchdb:
        condition: service_healthy

  couchdb:
    restart: unless-stopped
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./local.ini:/opt/couchdb/etc/local.d/jwt-cors.ini

volumes:
  couchdb_data:

configs:
  nginx_prod_conf:
    content: |
      server {
          listen 80;
          server_name _;

          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-Content-Type-Options "nosniff" always;

          # Serve built Vue SPA directly from Nginx
          location / {
              root /usr/share/nginx/html;
              index index.html;
              try_files $$uri $$uri/ /index.html;
          }

          # Express Auth Service
          location /auth/ {
              proxy_pass http://auth:4000/;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          # CouchDB Database
          location /db/ {
              proxy_pass http://couchdb:5984/;
              proxy_http_version 1.1;
              proxy_redirect off;
              proxy_buffering off;

              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location /db/_utils {
              return 403;
          }
      }
